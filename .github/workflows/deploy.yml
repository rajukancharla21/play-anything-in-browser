name: CI & Deployment Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  # 1. Automated Quality & Lint Validation (Always runs & passes green for everyone)
  validate-and-test:
    name: Lint & Code Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies & Linters
        run: |
          python -m pip install --upgrade pip
          pip install ruff fastapi uvicorn pydantic httpx
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Ruff Code Quality Check
        run: |
          ruff check .

      - name: Verify Backend Compilation
        run: |
          python -m py_compile app.py
          python -m py_compile gcp_infra/spinup_gpu_server.py

      - name: Test Orchestrator Smoke Launch
        run: |
          python -m uvicorn app:app --host 127.0.0.1 --port 8000 &
          SERVER_PID=$!
          sleep 3
          curl -f http://127.0.0.1:8000/api/config || exit 1
          kill $SERVER_PID

  # 2. Optional Continuous Deployment to GCP GPU Server
  # Automatically runs if GCP_SA_KEY secret is configured, otherwise skips gracefully without failing
  deploy-to-gcp:
    name: Deploy to GCP Cloud GPU
    needs: validate-and-test
    runs-on: ubuntu-latest
    if: ${{ secrets.GCP_SA_KEY != '' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy & Sync on GCP Server
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || 'visiblie-dev' }}
          ZONE: ${{ secrets.GCP_ZONE || 'us-central1-a' }}
          INSTANCE_NAME: ${{ secrets.GCP_INSTANCE_NAME || 'gaming-gpu-node' }}
        run: |
          echo "Deploying latest code directly to GCP GPU VM ($INSTANCE_NAME in $ZONE)..."
          gcloud compute ssh "$INSTANCE_NAME" \
            --project="$PROJECT_ID" \
            --zone="$ZONE" \
            --command="
              set -e
              cd /opt/play-anything || (mkdir -p /opt/play-anything && cd /opt/play-anything && git clone https://github.com/rajukancharla21/play-anything-in-browser.git .)
              git pull origin master || git pull origin main
              docker compose down || true
              docker compose up -d --build
            "
