<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Play Anything in Browser</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

  <!-- Clean Minimalist Header: Title, LinkedIn, GitHub alone -->
  <header>
    <div class="header-container">
      <div class="brand-wrapper">
        <div class="brand-icon" title="Gaming Station">
          <!-- Sleek React/Lucide Gamepad Icon -->
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="6" y1="12" x2="10" y2="12"></line>
            <line x1="8" y1="10" x2="8" y2="14"></line>
            <line x1="15" y1="13" x2="15.01" y2="13"></line>
            <line x1="18" y1="11" x2="18.01" y2="11"></line>
            <rect x="2" y="6" width="20" height="12" rx="4"></rect>
          </svg>
        </div>
        <div style="display: flex; align-items: baseline; gap: 0.6rem;">
          <h1 class="brand-name">Play Anything in Browser</h1>
          <span style="font-size: 0.75rem; color: var(--text-muted);">
            by <a href="https://www.linkedin.com/in/rajukancharla/" target="_blank" style="color: var(--primary-blue); text-decoration: none; font-weight: 500;">Raju Kancharla</a>
          </span>
        </div>
      </div>

      <!-- Right Header Actions -->
      <div class="header-right">
        <span class="compute-badge" id="computeBadge">
          <span class="compute-dot"></span>
          <span id="computeStatusText">Remote GPU Stream (Isolated)</span>
        </span>

        <span class="gamepad-badge" id="gamepadIndicator">
          🎮 Gamepad: None
        </span>

        <div class="ping-pill" title="Actual round-trip latency to streaming host">
          <span class="ping-dot"></span>
          <span id="headerPingVal">-- ms</span>
        </div>

        <a href="https://github.com/rajukancharla21/play-anything-in-browser" target="_blank" class="btn-secondary" style="padding: 0.25rem 0.6rem; font-size: 0.75rem;">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/></svg>
          GitHub
        </a>
      </div>
    </div>
  </header>

  <!-- Main Game Player Screen: Full edge-to-edge space -->
  <main style="width: 100%; max-width: 100%; margin: 0; padding: 0.5rem 1rem;">
    <div class="player-container" style="width: 100%;">
      
      <!-- Minimalist Game Controls & Switcher Bar -->
      <div class="player-toolbar">
        <div style="display: flex; align-items: center; gap: 0.6rem;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-muted);"><rect x="2" y="6" width="20" height="12" rx="4"/><line x1="6" y1="12" x2="10" y2="12"/><line x1="8" y1="10" x2="8" y2="14"/><line x1="15" y1="13" x2="15.01" y2="13"/><line x1="18" y1="11" x2="18.01" y2="11"/></svg>
          <label for="gameSelector" style="font-size: 0.8rem; font-weight: 500; color: var(--text-muted);">Title:</label>
          <select id="gameSelector" style="padding: 0.35rem 0.65rem; border: 1px solid var(--border-subtle); border-radius: 6px; font-size: 0.825rem; font-weight: 500; background: #fff; outline: none; cursor: pointer;">
            <option value="gtavc">GTA: Vice City (Direct Play)</option>
            <option value="pop">Prince of Persia (1989)</option>
            <option value="doom">DOOM (1993 Shareware)</option>
            <option value="remote">Remote Cloud GPU Host (GTA V / PC Stream)</option>
            <option value="supertux">SuperTux 2 (Linux Container)</option>
          </select>

        </div>

        <div class="player-actions">
          <button class="btn-secondary" id="btnLockPointer" title="Lock Mouse for 360 FPS Mouse Look">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="22" y1="12" x2="18" y2="12"/><line x1="6" y1="12" x2="2" y2="12"/><line x1="12" y1="6" x2="12" y2="2"/><line x1="12" y1="22" x2="12" y2="18"/></svg>
            Lock Mouse
          </button>
          <button class="btn-secondary" id="btnRestartGame" title="Reload Game Stream">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
            Reload
          </button>
          <button class="btn-primary" id="btnFullscreen" style="width: auto; padding: 0.35rem 0.75rem;" title="Toggle Fullscreen">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
            Fullscreen
          </button>
        </div>
      </div>

      <!-- Live Game Screen Viewport -->
      <div class="viewport-frame" id="viewportFrame">
        <iframe id="gameIframe" src="about:blank" allow="autoplay; gamepad; fullscreen; keyboard"></iframe>
        
        <!-- Minimal HUD overlay -->
        <div class="minimal-hud" id="minimalHud">
          <div class="hud-pill">
            <span>Latency:</span>
            <span class="val" id="hudPing">-- ms</span>
          </div>
          <div class="hud-pill">
            <span>Compute:</span>
            <span class="val" id="hudCompute">Remote Machine</span>
          </div>
          <div class="hud-pill">
            <span>Local Load:</span>
            <span class="val" style="color: var(--success-green);">0% GPU</span>
          </div>
        </div>
      </div>

      <!-- Controls & Status Footer -->
      <div style="font-size: 0.8rem; color: var(--text-muted); background: #fff; padding: 0.65rem 1rem; border-radius: 6px; border: 1px solid var(--border-subtle); display: flex; justify-content: space-between; align-items: center;">
        <span id="hintText">Controls: Click screen to focus • WASD / Arrow keys • Mouse Look • Gamepad Supported</span>
        <span style="font-family: var(--font-mono); font-size: 0.75rem;">Status: <span id="streamStatusText" style="color: var(--success-green); font-weight: 500;">Connected (Isolated Remote Stream)</span></span>
      </div>

    </div>
  </main>

  <!-- Notification Toasts -->
  <div class="toast-shelf" id="toastShelf"></div>

  <!-- Scripts -->
  <script src="/static/js/app.js"></script>
</body>
</html>
